<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人机协同图像标注系统</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="logo"></span>
    <span class="title">人机协同图像标注系统</span>
  </div>

  <div class="modes" id="modeTabs">
    <button class="mode-btn active" data-mode="seg">
      <span class="mode-name">实例分割</span>
      <span class="mode-desc">掩码</span>
    </button>
    <button class="mode-btn" data-mode="det">
      <span class="mode-name">目标检测</span>
      <span class="mode-desc">矩形框</span>
    </button>
    <button class="mode-btn" data-mode="sem">
      <span class="mode-name">语义分割</span>
      <span class="mode-desc">按类合并</span>
    </button>
  </div>

  <div class="status">
    <div class="stat">
      <span class="stat-label">已审核</span>
      <span class="stat-value" id="statReviewed">0 / 0</span>
    </div>
    <div class="stat">
      <span class="stat-label">修正</span>
      <span class="stat-value accent" id="statEdited">0 / 60</span>
    </div>
    <div class="stat">
      <span class="stat-label">修正率</span>
      <span class="stat-value" id="statRate">—</span>
    </div>
  </div>
  <!-- 窄屏（手机/平板竖屏）才显示：左右两栏收成抽屉，用这两个按钮呼出。
       手机顶栏宽度紧张，这里只用图标 + title 提示，不放文字。
       图标用内联 SVG 而不是 ☰ / ⚙ 这类字符：部分设备（含无头浏览器）
       缺这些字形，会渲染成一个方框，看起来像按钮坏了。 -->
  <div class="mobile-nav">
    <button class="mini-btn" id="btnLeftDrawer" title="图片列表" aria-label="图片列表">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true">
        <path d="M1 3h12M1 7h12M1 11h12" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" fill="none"/>
      </svg>
    </button>
    <button class="mini-btn" id="btnRightDrawer" title="对象属性" aria-label="对象属性">属性</button>
  </div>
</header>

<div class="layout">

  <!-- ============ 左侧：图片列表 ============ -->
  <aside class="panel panel-left">
    <div class="panel-head">
      <span>图片列表</span>
      <span class="muted mono" id="imgCount">0</span>
    </div>

    <div class="upload-box">
      <input type="file" id="fileInput" accept="image/*" multiple class="hidden-input">
      <button class="btn btn-primary btn-upload" id="btnUpload">＋ 上传照片并标注</button>
      <div class="upload-tip">也可把图片直接拖到窗口任意位置</div>
      <label class="chk upload-auto">
        <input type="checkbox" id="autoPrelabel" checked> 上传后自动预标注
      </label>
    </div>

    <div class="tool-row">
      <button class="btn" id="btnPrelabel">预标注</button>
      <button class="btn" id="btnRelabel">回标</button>
    </div>
    <div class="tool-row">
      <button class="btn" id="btnExport">导出数据集</button>
      <button class="btn" id="btnTrain">训练</button>
    </div>
    <div class="tool-row">
      <button class="btn btn-ghost" id="btnCompare">对比结果</button>
      <button class="btn btn-ghost" id="btnRecords">修正记录</button>
    </div>

    <!-- 自主学习：攒够修正自己学一代，过线才换权重 -->
    <div class="auto-learn" id="autoLearnBox">
      <label class="auto-head">
        <input type="checkbox" id="autoLearn">
        <span class="auto-name">自主学习</span>
        <span class="auto-badge" id="autoBadge">关</span>
      </label>
      <div class="auto-line" id="autoLine">开启后，攒够规定条数的修正会自动微调一代</div>
      <div class="auto-line auto-sub" id="autoSub"></div>
      <button class="auto-run hidden" id="btnAutoRun">立即学一代</button>
    </div>

    <div class="progress-wrap hidden" id="progressWrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text mono" id="progressText">准备中…</div>
    </div>

    <div class="trash-bar hidden" id="trashBar">
      <span class="trash-text" id="trashText">—</span>
      <button class="trash-btn" id="btnRestore">恢复</button>
    </div>

    <div class="list-head">
      <span>文件</span><span>状态</span>
    </div>
    <div class="img-list" id="imgList"></div>
  </aside>

  <!-- ============ 中间：画布 ============ -->
  <main class="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas"></canvas>
      <div class="drawing-tip hidden" id="drawingTip"></div>
      <div class="empty-hint" id="emptyHint">
        <p id="emptyTitle">还没有图片</p>
        <p class="muted" id="emptySub">把照片拖进这个窗口，或点下面的按钮</p>
        <button class="btn btn-primary" id="btnUploadEmpty">＋ 上传照片</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="tool-group">
        <button class="btn btn-ghost btn-xs" id="btnUndo" disabled
                title="撤销上一步（Ctrl+Z）">↶ 撤销</button>
        <button class="btn btn-ghost btn-xs" id="btnRedo" disabled
                title="没有可重做的操作（Ctrl+Shift+Z）">↷ 重做</button>
      </div>
      <div class="tool-group">
        <span class="tool-label">工具</span>
        <button class="tool-btn" data-tool="select" title="选择 / 移动对象：点击对象选中，选中后按 Delete 删除">选择</button>
        <button class="tool-btn" data-tool="polygon" title="多边形描轮廓：逐个点击物体轮廓上的点，围完一圈后双击（或按 Enter）闭合；右键撤回上一个点">多边形</button>
        <button class="tool-btn" data-tool="brush" title="画笔：先选中一个对象，再按住鼠标涂抹增/删它的轮廓">画笔</button>
        <button class="tool-btn" data-tool="erase" title="橡皮：先选中一个对象，再涂抹削掉它的轮廓">橡皮</button>
        <button class="tool-btn" data-tool="box" title="框选修形：选中一个对象，在画布上拉一个框，把框内的区域并进轮廓（修「只圈了一半」）／挖掉（修「多圈了」）／替换成这个框">框选修形</button>
      </div>
      <div class="tool-group" id="boxHint" hidden>
        <span class="tool-hint">
          先选中对象，再拉一个框：
        </span>
        <button class="btn btn-ghost btn-xs box-mode active" data-boxmode="add"
                title="把框里的区域并进当前轮廓——模型只圈了一半时用它">并入</button>
        <button class="btn btn-ghost btn-xs box-mode" data-boxmode="cut"
                title="把框里的区域从当前轮廓里挖掉——模型多圈了桌子/杂物时用它">挖掉</button>
        <button class="btn btn-ghost btn-xs box-mode" data-boxmode="replace"
                title="轮廓直接换成这个框，再拖顶点贴合">替换</button>
        <button class="btn btn-ghost btn-xs" id="btnCancelBox">退出</button>
      </div>
      <div class="tool-group" id="polyHint" hidden>
        <span class="tool-hint">
          逐点点击轮廓 → <b>双击</b>或 <b>Enter</b> 闭合 · <b>右键</b>撤回上一点
        </span>
        <button class="btn btn-ghost btn-xs" id="btnUndoPt"
                title="撤回上一个点（快捷键退格）">← 撤回一点</button>
        <button class="btn btn-ghost btn-xs" id="btnFinishPoly">完成描边</button>
        <button class="btn btn-ghost btn-xs" id="btnCancelPoly2">放弃</button>
      </div>
      <div class="tool-group">
        <span class="tool-label">笔刷</span>
        <input type="range" id="brushSize" min="4" max="60" value="18">
        <span class="mono muted" id="brushSizeVal">18</span>
      </div>
      <div class="tool-group">
        <span class="tool-label">视图</span>
        <button class="tool-btn" id="btnZoomOut">－</button>
        <span class="mono" id="zoomLabel">100%</span>
        <button class="tool-btn" id="btnZoomIn">＋</button>
        <button class="tool-btn" id="btnFit">适配</button>
      </div>
      <div class="tool-group">
        <span class="tool-label">显示</span>
        <label class="chk"><input type="checkbox" id="showMask" checked> 掩码</label>
        <label class="chk"><input type="checkbox" id="showBox"> 框</label>
        <label class="chk"><input type="checkbox" id="showLabel" checked> 标签</label>
      </div>
    </div>
  </main>

  <!-- ============ 右侧：属性 + 修正记录 ============ -->
  <aside class="panel panel-right">
    <div class="panel-head">
      <span>标注对象</span>
      <span class="muted mono" id="objCount">0</span>
    </div>

    <div class="obj-filter">
      <button class="mini-btn" id="btnShowAll" title="显示全部对象">全选</button>
      <button class="mini-btn" id="btnHideAll" title="隐藏全部对象">全不选</button>
      <button class="mini-btn" id="btnFocusOnly" title="只显示当前选中的对象">仅看选中</button>
    </div>

    <div class="obj-list" id="objList"></div>

    <div class="panel-head sub">
      <span>选中对象</span>
    </div>
    <div class="props" id="props">
      <p class="muted small">在画布或上方列表中选择一个对象</p>
    </div>

    <div class="panel-head sub">
      <span>本图修正记录</span>
      <span class="muted mono" id="editCount">0</span>
    </div>
    <div class="edit-log" id="editLog">
      <p class="muted small">还没有修正</p>
    </div>
  </aside>
</div>

<!-- ============ 弹层 ============ -->
<div class="modal hidden" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <span id="modalTitle">标题</span>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div class="toast hidden" id="toast"></div>

<!-- 拖拽上传时的全屏提示 -->
<div class="drop-mask hidden" id="dropMask">
  <div class="drop-inner">
    <div class="drop-icon">⤓</div>
    <div>松开鼠标，照片加入数据集</div>
  </div>
</div>

<!-- 抽屉遮罩：点一下关闭左/右栏（窄屏专用） -->
<div class="drawer-mask" id="drawerMask" hidden></div>

<!-- 训练进度浮层。
     训练在后台跑 4~5 分钟，旧版只说一句「可在终端查看日志」——
     用户既不知道还有多久，也不知道跑完没有。这个卡片固定在画布上方，
     轮询 /api/train/status，跑完变绿并停在结果上，不自动消失。 -->
<div class="train-hud hidden" id="trainHud">
  <div class="train-hud-head">
    <span class="train-hud-title" id="trainTitle">正在训练…</span>
    <button class="train-hud-close" id="trainClose" title="收起">×</button>
  </div>
  <div class="train-hud-bar"><div class="train-hud-fill" id="trainFill"></div></div>
  <div class="train-hud-line" id="trainLine">准备中…</div>
  <div class="train-hud-sub mono" id="trainSub"></div>
  <div class="train-hud-foot">
    <span class="train-hud-note" id="trainNote"></span>
    <button class="train-hud-link" id="trainLogBtn">看日志</button>
  </div>
</div>

<script src="/static/geom.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
